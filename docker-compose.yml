services:
  backend:
    build:
      context: ./backend
      dockerfile: vendor/laravel/sail/runtimes/8.2/Dockerfile
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./backend:/var/www/html
    networks:
      - rms-network

  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - rms-network

networks:
  rms-network:
    driver: bridge
